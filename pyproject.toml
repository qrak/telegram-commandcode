[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-commandcode"
version = "2.2.0"
description = "Async Python Telegram bot bridging Telegram ↔ Command Code CLI — Hermes Agent architecture patterns"
authors = [{ name = "qrak" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=20.8,<22",
    "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["openai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "vulture>=2.11"]

[project.scripts]
telegram-commandcode = "telegram_commandcode.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["telegram_commandcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["error::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only correctness rules: undefined names, unused imports, unreachable code.
# Formatting is not enforced — the codebase predates this config.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.vulture]
# Slash-command handlers are dispatched by name through CommandRouter's
# {"/command": "method_name"} table, which vulture cannot see.
paths = ["telegram_commandcode"]
min_confidence = 60
ignore_names = ["handle_*"]
